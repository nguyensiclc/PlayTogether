<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" width="100%" height="100%" role="img" aria-labelledby="title-04">
  <title id="title-04">Ăn liên hoàn trong Ô ăn quan</title>
  <defs>
    <linearGradient id="bgGrad4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f4eee1"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#3d2b1d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="840" height="340" rx="16" fill="url(#bgGrad4)"/>

  <!-- Title -->
  <text x="420" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#2f6b5a">ĂN LIÊN HOÀN (ĂN DÂY NHIỀU Ô)</text>
  <text x="420" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#66503e">Sau khi ăn một ô, nếu ô kế tiếp lại TRỐNG và ô sau đó CÓ QUÂN → Ăn tiếp tục!</text>

  <!-- Flow Illustration -->
  <g transform="translate(60, 80)" filter="url(#shadow4)">
    <!-- Base box -->
    <rect width="720" height="180" rx="14" fill="#ffffff" stroke="#2f6b5a" stroke-width="2"/>

    <!-- Cell 2: Last dropped stone -->
    <rect x="30" y="45" width="85" height="90" rx="8" fill="#f5ede0" stroke="#b09c85" stroke-width="1.5"/>
    <text x="42" y="65" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c6f56">Ô 2</text>
    <text x="72" y="98" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#3d2b1d">6</text>
    <text x="72" y="122" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7a624d">Viên cuối</text>

    <!-- Cell 3: Empty (allows eating 4) -->
    <rect x="135" y="45" width="85" height="90" rx="8" fill="#fff" stroke="#d5c8b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="147" y="65" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c6f56">Ô 3</text>
    <text x="177" y="98" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#998370">0</text>
    <text x="177" y="122" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#998370">Trống</text>

    <!-- Arc 1: Jump over 3 into 4 -->
    <path d="M 72 40 Q 177 5 270 40" fill="none" stroke="#2f6b5a" stroke-width="3" stroke-linecap="round"/>
    <polygon points="274,42 268,34 264,44" fill="#2f6b5a"/>
    <text x="177" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#2f6b5a">Ăn lần 1</text>

    <!-- Cell 4: CAPTURED 1 (+6) -->
    <rect x="240" y="45" width="85" height="90" rx="8" fill="#e8f5f0" stroke="#2f6b5a" stroke-width="3"/>
    <text x="252" y="65" font-family="sans-serif" font-size="11" font-weight="700" fill="#2f6b5a">Ô 4</text>
    <text x="282" y="98" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#2f6b5a">+6</text>
    <text x="282" y="122" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#2f6b5a">ĂN 6 DÂN</text>

    <!-- Cell 5: Empty (allows eating Q6!) -->
    <rect x="345" y="45" width="85" height="90" rx="8" fill="#fff" stroke="#d5c8b8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="357" y="65" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c6f56">Ô 5</text>
    <text x="387" y="98" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#998370">0</text>
    <text x="387" y="122" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#998370">Lại trống</text>

    <!-- Arc 2: Jump over 5 into Q6 -->
    <path d="M 282 40 Q 387 5 500 40" fill="none" stroke="#2f6b5a" stroke-width="3" stroke-linecap="round"/>
    <polygon points="504,42 498,34 494,44" fill="#2f6b5a"/>
    <text x="387" y="24" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#2f6b5a">Ăn liên hoàn tiếp!</text>

    <!-- Cell Q6: CAPTURED 2 (+12) -->
    <path d="M 450 45 L 530 45 A 45 45 0 0 1 530 135 L 450 135 Z" fill="#e8f5f0" stroke="#2f6b5a" stroke-width="3"/>
    <text x="465" y="65" font-family="sans-serif" font-size="11" font-weight="700" fill="#2f6b5a">QUAN 6</text>
    <text x="500" y="98" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#2f6b5a">+12</text>
    <text x="500" y="122" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="800" fill="#2f6b5a">1Q + 2 DÂN</text>

    <!-- Total Score Pill -->
    <rect x="585" y="65" width="115" height="50" rx="10" fill="#2f6b5a"/>
    <text x="642" y="87" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#e8f5f0">TỔNG ĐIỂM ĂN</text>
    <text x="642" y="107" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#ffffff">+18 ĐIỂM</text>
  </g>

  <!-- Note -->
  <text x="420" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#2b1e14">Cứ cách 1 ô trống lại có 1 ô có quân thì ăn tiếp không giới hạn số lần!</text>
  <text x="420" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7a624d">Ăn dây có thể vòng qua ô quan và cả hàng của chính mình.</text>
</svg>
