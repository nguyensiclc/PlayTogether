<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%" role="img" aria-labelledby="title-03">
  <title id="title-03">4 tình huống sau khi thả viên sỏi cuối cùng</title>
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f4eee1"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf5ec"/>
    </linearGradient>
    <filter id="shadow3" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3d2b1d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="880" height="500" rx="16" fill="url(#bgGrad3)"/>

  <!-- Title -->
  <text x="440" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#2b1e14">4 TÌNH HUỐNG SAU KHI THẢ VIÊN SỎI CUỐI CÙNG</text>
  <text x="440" y="54" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7a624d">Xét ô liền kề (ô n) và ô tiếp theo (ô n+1) theo chiều đang rải</text>

  <!-- PANEL A: BỐC RẢI TIẾP -->
  <g transform="translate(30, 70)" filter="url(#shadow3)">
    <rect width="395" height="195" rx="12" fill="url(#panelGrad)" stroke="#e8a338" stroke-width="2"/>
    <rect x="16" y="14" width="28" height="28" rx="8" fill="#e8a338"/>
    <text x="30" y="33" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#2b1e14">A</text>
    <text x="54" y="33" font-family="sans-serif" font-size="16" font-weight="800" fill="#2b1e14">Bốc ô kế rải tiếp</text>
    <text x="16" y="60" font-family="sans-serif" font-size="12" fill="#66503e">Ô kế tiếp là ô dân và <tspan font-weight="700" fill="#b5462f">CÓ SỎI</tspan> → bốc hết lên rải tiếp.</text>

    <!-- Visual cells -->
    <!-- Cell dropped: 4 -->
    <rect x="40" y="80" width="80" height="80" rx="8" fill="#f5ede0" stroke="#b09c85" stroke-width="1.5"/>
    <text x="80" y="118" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#3d2b1d">6</text>
    <text x="80" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7a624d">Viên cuối</text>

    <!-- Arrow -->
    <path d="M 125 120 L 155 120" stroke="#e8a338" stroke-width="3" stroke-linecap="round"/>
    <polygon points="160,120 152,115 152,125" fill="#e8a338"/>

    <!-- Cell next: 5 (has stones) -->
    <rect x="165" y="80" width="80" height="80" rx="8" fill="#fff7e6" stroke="#e8a338" stroke-width="3"/>
    <text x="205" y="118" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#e8a338">6 sỏi</text>
    <text x="205" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#e8a338">BỐC RẢI TIẾP</text>

    <!-- Badge -->
    <rect x="270" y="100" width="105" height="40" rx="8" fill="#fff3d6" stroke="#e8a338" stroke-width="1"/>
    <text x="322" y="125" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#996300">↻ RẢI TIẾP</text>
  </g>

  <!-- PANEL B: GẶP Ô QUAN -> HẾT LƯỢT -->
  <g transform="translate(455, 70)" filter="url(#shadow3)">
    <rect width="395" height="195" rx="12" fill="url(#panelGrad)" stroke="#c4b5a5" stroke-width="1.5"/>
    <rect x="16" y="14" width="28" height="28" rx="8" fill="#8c7865"/>
    <text x="30" y="33" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#fff">B</text>
    <text x="54" y="33" font-family="sans-serif" font-size="16" font-weight="800" fill="#2b1e14">Gặp ô quan → Hết lượt</text>
    <text x="16" y="60" font-family="sans-serif" font-size="12" fill="#66503e">Ô kế tiếp là <tspan font-weight="700" fill="#3d2b1d">Ô QUAN CÒN QUÂN</tspan> → dừng lại ngay, hết lượt.</text>

    <!-- Visual cells -->
    <!-- Cell 5 (last dropped) -->
    <rect x="40" y="80" width="80" height="80" rx="8" fill="#f5ede0" stroke="#b09c85" stroke-width="1.5"/>
    <text x="80" y="118" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#3d2b1d">6</text>
    <text x="80" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#7a624d">Viên cuối</text>

    <!-- Block icon / Arrow -->
    <path d="M 125 120 L 155 120" stroke="#8c7865" stroke-width="3" stroke-linecap="round"/>
    <line x1="150" y1="110" x2="160" y2="130" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>

    <!-- Cell Q6 (Quan cell with Quan piece) -->
    <path d="M 165 80 L 210 80 A 40 40 0 0 1 210 160 L 165 160 Z" fill="#f5ede0" stroke="#8c7865" stroke-width="2"/>
    <circle cx="195" cy="115" r="14" fill="#3d2b1d"/>
    <text x="195" y="120" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff">Quan</text>
    <text x="195" y="145" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#c0392b">CẤM BỐC</text>

    <!-- Badge -->
    <rect x="260" y="100" width="115" height="40" rx="8" fill="#f0ebe4" stroke="#8c7865" stroke-width="1"/>
    <text x="317" y="125" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#5a4736">■ HẾT LƯỢT</text>
  </g>

  <!-- PANEL C: ĂN QUÂN (TRƯỜNG HỢP QUAN TRỌNG NHẤT!) -->
  <g transform="translate(30, 280)" filter="url(#shadow3)">
    <rect width="395" height="195" rx="12" fill="url(#panelGrad)" stroke="#2f6b5a" stroke-width="2.5"/>
    <rect x="16" y="14" width="28" height="28" rx="8" fill="#2f6b5a"/>
    <text x="30" y="33" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#fff">C</text>
    <text x="54" y="33" font-family="sans-serif" font-size="16" font-weight="800" fill="#2f6b5a">ĂN QUÂN (Cách 1 ô trống)</text>
    <text x="16" y="60" font-family="sans-serif" font-size="12" fill="#66503e">Ô kế TRỐNG và ô sau đó CÓ SỎI → <tspan font-weight="800" fill="#2f6b5a">ĂN HẾT Ô SAU!</tspan></text>

    <!-- Visual cells -->
    <!-- Cell dropped: 3 -->
    <rect x="25" y="80" width="70" height="80" rx="8" fill="#f5ede0" stroke="#b09c85" stroke-width="1.5"/>
    <text x="60" y="118" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#3d2b1d">6</text>
    <text x="60" y="145" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7a624d">Viên cuối</text>

    <!-- Cell next: 4 (EMPTY) -->
    <rect x="105" y="80" width="70" height="80" rx="8" fill="#fff" stroke="#d5c8b8" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="140" y="118" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="800" fill="#998370">0</text>
    <text x="140" y="145" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#998370">Ô trống</text>

    <!-- Skip arrow over empty cell -->
    <path d="M 60 75 Q 140 40 215 75" fill="none" stroke="#2f6b5a" stroke-width="3" stroke-linecap="round"/>
    <polygon points="220,78 214,70 210,80" fill="#2f6b5a"/>

    <!-- Cell next+1: 5 (CAPTURED!) -->
    <rect x="185" y="80" width="75" height="80" rx="8" fill="#e8f5f0" stroke="#2f6b5a" stroke-width="3"/>
    <text x="222" y="118" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#2f6b5a">+6</text>
    <text x="222" y="145" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#2f6b5a">ĂN Ô NÀY</text>

    <!-- Badge -->
    <rect x="275" y="100" width="105" height="40" rx="8" fill="#2f6b5a"/>
    <text x="327" y="125" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#fff">+ ĂN QUÂN</text>
  </g>

  <!-- PANEL D: HAI Ô TRỐNG -> HẾT LƯỢT -->
  <g transform="translate(455, 280)" filter="url(#shadow3)">
    <rect width="395" height="195" rx="12" fill="url(#panelGrad)" stroke="#c4b5a5" stroke-width="1.5"/>
    <rect x="16" y="14" width="28" height="28" rx="8" fill="#8c7865"/>
    <text x="30" y="33" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#fff">D</text>
    <text x="54" y="33" font-family="sans-serif" font-size="16" font-weight="800" fill="#2b1e14">Hai ô trống → Hết lượt</text>
    <text x="16" y="60" font-family="sans-serif" font-size="12" fill="#66503e">Sau viên cuối gặp <tspan font-weight="700" fill="#c0392b">2 ô trống liên tiếp</tspan> → không ăn được, hết lượt.</text>

    <!-- Visual cells -->
    <!-- Cell dropped: 3 -->
    <rect x="30" y="80" width="65" height="80" rx="8" fill="#f5ede0" stroke="#b09c85" stroke-width="1.5"/>
    <text x="62" y="118" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#3d2b1d">6</text>
    <text x="62" y="145" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#7a624d">Viên cuối</text>

    <!-- Cell next: 4 (EMPTY) -->
    <rect x="105" y="80" width="65" height="80" rx="8" fill="#fff" stroke="#d5c8b8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="137" y="118" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#998370">0</text>
    <text x="137" y="145" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#998370">Trống</text>

    <!-- Cell next+1: 5 (ALSO EMPTY) -->
    <rect x="180" y="80" width="65" height="80" rx="8" fill="#fff" stroke="#d5c8b8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="212" y="118" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#998370">0</text>
    <text x="212" y="145" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#998370">Trống</text>

    <!-- Badge -->
    <rect x="260" y="100" width="115" height="40" rx="8" fill="#f0ebe4" stroke="#8c7865" stroke-width="1"/>
    <text x="317" y="125" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#5a4736">■ HẾT LƯỢT</text>
  </g>
</svg>
