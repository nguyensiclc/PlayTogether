<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="100%" height="100%" role="img" aria-labelledby="title-05">
  <title id="title-05">Luật bù dân khi hết sỏi trên hàng</title>
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f4eee1"/>
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#3d2b1d" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="840" height="320" rx="16" fill="url(#bgGrad5)"/>

  <!-- Title -->
  <text x="420" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="800" fill="#b5462f">LUẬT BÙ DÂN (KHI CẢ 5 Ô DÂN ĐỀU TRỐNG)</text>
  <text x="420" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#66503e">Đến lượt mà hàng không còn dân để đi → Trừ 5 điểm từ kho, đặt 1 dân vào mỗi ô</text>

  <!-- Flow Illustration -->
  <g transform="translate(60, 80)" filter="url(#shadow5)">
    <!-- Base box -->
    <rect width="720" height="170" rx="14" fill="#ffffff" stroke="#b5462f" stroke-width="2"/>

    <!-- Score Pile Box (Kho điểm) -->
    <rect x="25" y="35" width="140" height="100" rx="10" fill="#fff5f2" stroke="#b5462f" stroke-width="2"/>
    <text x="95" y="60" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#b5462f">KHO ĐIỂM CỦA BẠN</text>
    <text x="95" y="85" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="800" fill="#2b1e14">20 điểm</text>
    <rect x="45" y="98" width="100" height="24" rx="12" fill="#b5462f"/>
    <text x="95" y="114" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">−5 ĐIỂM BÙ</text>

    <!-- Arrows from score pile to cells -->
    <path d="M 165 85 Q 210 50 250 65" fill="none" stroke="#b5462f" stroke-width="2.5" stroke-dasharray="4,3"/>
    <path d="M 165 85 Q 260 30 350 65" fill="none" stroke="#b5462f" stroke-width="2.5" stroke-dasharray="4,3"/>
    <path d="M 165 85 Q 310 20 450 65" fill="none" stroke="#b5462f" stroke-width="2.5" stroke-dasharray="4,3"/>
    <path d="M 165 85 Q 360 10 550 65" fill="none" stroke="#b5462f" stroke-width="2.5" stroke-dasharray="4,3"/>
    <path d="M 165 85 Q 410 5 640 65" fill="none" stroke="#b5462f" stroke-width="2.5" stroke-dasharray="4,3"/>

    <!-- Row of 5 cells (previously 0, now each has 1) -->
    <!-- Cell 1 -->
    <rect x="210" y="55" width="85" height="85" rx="8" fill="#fdfbf7" stroke="#b5462f" stroke-width="2"/>
    <text x="220" y="75" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c6f56">Ô 1</text>
    <circle cx="252" cy="100" r="14" fill="#b5462f"/>
    <text x="252" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#fff">1</text>

    <!-- Cell 2 -->
    <rect x="310" y="55" width="85" height="85" rx="8" fill="#fdfbf7" stroke="#b5462f" stroke-width="2"/>
    <text x="320" y="75" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c6f56">Ô 2</text>
    <circle cx="352" cy="100" r="14" fill="#b5462f"/>
    <text x="352" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#fff">1</text>

    <!-- Cell 3 -->
    <rect x="410" y="55" width="85" height="85" rx="8" fill="#fdfbf7" stroke="#b5462f" stroke-width="2"/>
    <text x="420" y="75" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c6f56">Ô 3</text>
    <circle cx="452" cy="100" r="14" fill="#b5462f"/>
    <text x="452" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#fff">1</text>

    <!-- Cell 4 -->
    <rect x="510" y="55" width="85" height="85" rx="8" fill="#fdfbf7" stroke="#b5462f" stroke-width="2"/>
    <text x="520" y="75" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c6f56">Ô 4</text>
    <circle cx="552" cy="100" r="14" fill="#b5462f"/>
    <text x="552" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#fff">1</text>

    <!-- Cell 5 -->
    <rect x="610" y="55" width="85" height="85" rx="8" fill="#fdfbf7" stroke="#b5462f" stroke-width="2"/>
    <text x="620" y="75" font-family="sans-serif" font-size="11" font-weight="700" fill="#8c6f56">Ô 5</text>
    <circle cx="652" cy="100" r="14" fill="#b5462f"/>
    <text x="652" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#fff">1</text>
  </g>

  <!-- Warning / Explanation -->
  <text x="420" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#2b1e14">Sau khi bù dân, người chơi chọn 1 trong 5 ô vừa được cấp dân để rải như bình thường.</text>
  <text x="420" y="302" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#c0392b">⚠️ Nếu kho điểm còn dưới 5 điểm mà không đủ bù dân → Bị xử THUA ngay lập tức!</text>
</svg>
