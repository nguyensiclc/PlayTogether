<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nhập nickname</title>
<!-- Mockup: Vào phòng bằng link mời, lần đầu (chưa có nickname) · Mốc M3 · UX mục 2.2 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  .invite { margin-top: 28px; text-align: center; }
  .host-av { width: 72px; height: 72px; font-size: 26px; margin: 0 auto 14px; box-shadow: 0 0 0 5px var(--surface), var(--shadow); }
  .invite h1 { font-size: 22px; }
  .room-card { margin-top: 22px; display: flex; align-items: center; gap: 12px; text-align: left; }
  .room-card .mini { width: 52px; height: 52px; border-radius: 12px; background: #f3d9cf; display: grid; place-items: center; flex: none; }
  .room-card .code { font-weight: 800; letter-spacing: .15em; }
  .seats { display: flex; margin-top: 6px; }
  .seats .avatar { width: 24px; height: 24px; font-size: 10px; border: 2px solid var(--surface); }
  .seats .avatar + .avatar { margin-left: -6px; }
  .form { margin-top: 26px; }
  .names { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .names .chip { height: 32px; }
  .keyboard { margin: 22px -16px -24px; height: 210px; background: #d6d0c6; display: grid; place-items: center; color: #8a8377; font-size: 13px; }
</style>
</head>
<body>
<div class="screen">
  <div class="topbar"><div class="logo" style="padding-left:8px"><span class="logo-mark"><i></i></span>PlayTogether</div></div>

  <section class="invite">
    <div class="avatar av1 host-av">CT</div>
    <h1>Cò Trắng 42 mời bạn<br>chơi Ô ăn quan</h1>
    <div class="card room-card">
      <span class="mini"><svg width="38" height="38" viewBox="0 0 40 40"><rect x="3" y="12" width="34" height="16" rx="8" fill="#8a5a2e"/><g fill="#eee6d4"><circle cx="13" cy="17" r="2"/><circle cx="20" cy="17" r="2"/><circle cx="27" cy="17" r="2"/><circle cx="13" cy="23" r="2"/><circle cx="20" cy="23" r="2"/><circle cx="27" cy="23" r="2"/></g></svg></span>
      <div style="flex:1">
        <div>Phòng <span class="code">ABCD</span></div>
        <div class="seats"><span class="avatar av1">CT</span><span class="avatar empty" style="border-width:2px">+</span><span class="small muted" style="margin-left:8px">Còn 1 ghế trống</span></div>
      </div>
    </div>
  </section>

  <section class="form">
    <span class="lbl">Tên của bạn trong phòng</span>
    <div class="field focus"><input value="Mèo Mun" maxlength="20"><span class="tiny muted" style="padding-right:10px">7/20</span></div>
    <div class="names"><span class="small muted" style="align-self:center">Gợi ý:</span><span class="chip">🎲 Ngẫu nhiên</span><span class="chip">Sóc Nâu</span><span class="chip">Cá Vàng 7</span></div>
    <a class="btn primary block" style="margin-top:16px">Vào phòng</a>
    <p class="tiny muted" style="text-align:center;margin-top:10px">Không cần đăng ký. Tên được lưu trên máy này.</p>
  </section>

  <div class="spacer"></div>
  <div class="keyboard">Bàn phím điện thoại</div>
</div>
</body>
</html>
