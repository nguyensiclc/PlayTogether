<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lật bàn desktop</title>
<!-- Mockup desktop 1280 × 800: Hộp hỏi Lật bàn, modal giữa màn hình · Mốc M2 · luật mục 9 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/desktop.css">
<style>
  body { overflow: hidden; height: 100vh; min-height: 800px; position: relative; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .modal h2 { font-size: 22px; }
  .compare { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin: 20px 0; }
  .side { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 16px; text-align: center; }
  .side.after { border: 2px solid var(--accent); background: #fff6df; }
  .side b { display: block; font-size: 32px; line-height: 1.1; margin: 4px 0; }
  .swap { width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; }
  .swap svg { width: 20px; height: 20px; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .acts .btn { justify-content: space-between; }
  .t { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
  .t .timer { flex: 1; margin: 0; }
</style>
</head>
<body class="desk">
<iframe class="bg" src="ban-choi-desktop.html" title="Bàn chơi (nền)" tabindex="-1"></iframe>
<div class="scrim"></div>
<section class="modal">
  <h2>Đổi bên với đối thủ?</h2>
  <p class="small muted" style="margin-top:6px">Bạn được Lật bàn một lần, ngay sau nước mở đầu. Bàn giữ nguyên: bạn nhận bên của Cò Trắng 42 cùng kho điểm của bên đó, còn Cò Trắng 42 sẽ đi tiếp ở bên của bạn.</p>
  <div class="compare">
    <div class="side"><span class="tiny muted">Giữ bên</span><b>0</b><span class="tiny">điểm<br>bạn đi tiếp</span></div>
    <span class="swap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg></span>
    <div class="side after"><span class="tiny muted">Lật bàn</span><b>6</b><span class="tiny">điểm<br>đối thủ đi tiếp</span></div>
  </div>
  <div class="acts">
    <a class="btn">Giữ bên <kbd>Esc</kbd></a>
    <a class="btn primary">Lật bàn <kbd style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)">L</kbd></a>
  </div>
  <div class="t"><span class="tiny muted">Đồng hồ vẫn chạy</span><div class="timer"><i style="width:80%"></i></div><span class="tiny muted">24s</span></div>
</section>
</body>
</html>
