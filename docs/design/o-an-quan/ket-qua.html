<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kết quả ván</title>
<!-- Mockup: Kết quả ván, mình thắng, kết thúc do hết quan, đối thủ đã bấm Ván nữa · Mốc M2/M5 · UX mục 2.5 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<script src="../shared/board.js"></script>
<style>
  .screen { gap: 12px; }
  .board-wrap { margin-top: 12px; }
  .result {
    position: absolute; left: 12px; right: 12px; top: 72px; z-index: 21;
    background: var(--surface); border-radius: 22px; padding: 22px 18px 18px;
    box-shadow: 0 18px 50px rgba(0,0,0,.3); text-align: center;
  }
  .trophy { width: 64px; height: 64px; border-radius: 50%; background: #fbe9c4; margin: -54px auto 10px; display: grid; place-items: center; font-size: 32px; box-shadow: 0 0 0 6px var(--surface); }
  .result h1 { font-size: 28px; }
  .reason { display: inline-flex; margin-top: 8px; }
  .vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin: 18px 0 6px; }
  .vs .p { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .vs .p b { font-size: 34px; line-height: 1; }
  .vs .p.win b { color: var(--capture); }
  .vs .sep { color: var(--muted); font-weight: 700; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
  th, td { padding: 8px 4px; border-top: 1px solid var(--line); }
  th { text-align: left; font-weight: 500; color: var(--muted); }
  td { text-align: right; font-weight: 600; width: 70px; }
  tr.total th, tr.total td { font-weight: 800; color: var(--ink); font-size: 15px; }
  .ready { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 14px 0 10px; font-size: 13px; color: #23704a; font-weight: 600; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
</style>
</head>
<body>
<div class="screen">
  <div class="topbar">
    <a class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="title">Ô ăn quan</div>
    <a class="icon-btn" style="font-weight:800">?</a>
  </div>
  <div class="player"><span class="avatar av3">MM</span><div class="info"><div class="name">Mèo Mun</div></div><div class="score"><b>31</b></div></div>
  <div class="board-wrap"><div id="b"></div></div>
  <div class="player"><span class="avatar av1">CT</span><div class="info"><div class="name">Cò Trắng 42</div></div><div class="score"><b>39</b></div></div>

  <div class="scrim"></div>
  <section class="result">
    <div class="trophy">🏆</div>
    <h1>Bạn thắng!</h1>
    <span class="chip reason">Hết quan · thu dân về</span>

    <div class="vs">
      <div class="p win"><span class="avatar av1">CT</span><span class="small">Bạn</span><b>39</b></div>
      <span class="sep">–</span>
      <div class="p"><span class="avatar av3">MM</span><span class="small">Mèo Mun</span><b>31</b></div>
    </div>

    <table>
      <tr><th></th><td class="tiny muted" style="font-weight:600">Bạn</td><td class="tiny muted" style="font-weight:600">Mèo Mun</td></tr>
      <tr><th>Dân đã ăn</th><td>21</td><td>18</td></tr>
      <tr><th>Quan đã ăn (×10)</th><td>1 · 10</td><td>1 · 10</td></tr>
      <tr><th>Bù dân</th><td>0</td><td>1 lần</td></tr>
      <tr><th>Dân thu cuối ván</th><td>8</td><td>3</td></tr>
      <tr class="total"><th>Tổng</th><td>39</td><td>31</td></tr>
    </table>

    <div class="ready"><span class="avatar sm av3" style="width:20px;height:20px;font-size:9px">MM</span>Mèo Mun muốn chơi ván nữa</div>
    <a class="btn primary block">Ván nữa · Mèo Mun đi trước</a>
    <div class="acts">
      <a class="btn sm">Về phòng chờ</a>
      <a class="btn sm">Chia sẻ kết quả</a>
    </div>
  </section>
</div>
<script>
  renderBoard(document.getElementById("b"), { dan: [0, 2, 0, 3, 1, 2, 0, 0, 1, 0, 2, 0], quan: [false, false] });
</script>
</body>
</html>
